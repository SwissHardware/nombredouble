<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Les Doubles avec Coccinelle 🐞</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --rouge: #ff5252;
    --rouge-fonce: #c83232;
    --noir: #1f1f1f;
    --bleu: #5ec5e6;
    --bleu-fonce: #2a9bbf;
    --jaune: #ffd54a;
    --rose: #ff8fb1;
    --vert: #6bd97a;
    --vert-fonce: #43a64f;
    --violet: #b294ff;
    --fond: #fffaf2;
    --texte: #2b3a55;
  }
  html, body {
    height: 100%;
    font-family: 'Comic Sans MS', 'Comic Neue', system-ui, sans-serif;
    background: linear-gradient(135deg, #ffe5e5 0%, #fff9ec 50%, #d0f1ff 100%);
    color: var(--texte);
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
  }
  /* ---- HEADER ---- */
  .header {
    width: 100%;
    max-width: 950px;
    background: white;
    border-radius: 28px;
    padding: 14px 20px;
    margin-bottom: 16px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08);
    border: 4px solid var(--rouge);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .header-haut {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .titre-jeu {
    font-size: 1.5rem;
    color: var(--rouge-fonce);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
  }
  .niveau-actuel {
    background: var(--jaune);
    padding: 6px 16px;
    border-radius: 999px;
    font-weight: bold;
    font-size: 1rem;
  }
  .collection-coccinelles {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .slot-cocci {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #f0f0f0;
    border: 3px dashed #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    color: #aaa;
    transition: all 0.4s;
  }
  .slot-cocci.gagnee {
    background: linear-gradient(135deg, #fff0c4, #ffd54a);
    border-style: solid;
    border-color: var(--rouge);
    transform: scale(1.05);
    box-shadow: 0 0 0 4px rgba(255,82,82,0.2);
  }
  .slot-cocci.gagnee::before { content: '🐞'; }
  @keyframes pop-cocci {
    0% { transform: scale(0) rotate(-180deg); }
    60% { transform: scale(1.4) rotate(20deg); }
    100% { transform: scale(1.05) rotate(0); }
  }
  .slot-cocci.nouvelle { animation: pop-cocci 0.7s ease; }

  /* ---- CARTE ---- */
  .carte {
    background: white;
    border-radius: 30px;
    padding: 30px 26px;
    width: 100%;
    max-width: 950px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.06), 0 20px 40px rgba(0,0,0,0.08);
    border: 4px solid var(--rouge);
    animation: apparition 0.4s ease;
  }
  @keyframes apparition {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .etape-label {
    background: var(--rouge);
    color: white;
    display: inline-block;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .consigne {
    font-size: 1.4rem;
    margin-bottom: 22px;
    color: var(--texte);
    font-weight: bold;
  }
  .consigne .gros-emoji { font-size: 1.6rem; }

  /* ---- COMPOSANTS ---- */
  .grille-doubles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .bulle {
    background: linear-gradient(135deg, var(--fond), #ffeaca);
    border: 4px solid #f0d8a8;
    border-radius: 22px;
    padding: 22px 10px;
    font-size: 1.6rem;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    user-select: none;
    color: var(--texte);
  }
  .bulle:hover, .bulle:active {
    transform: translateY(-4px) scale(1.04);
    border-color: var(--rouge);
  }
  .bulle.choisi-double {
    background: linear-gradient(135deg, #8fe89e, var(--vert));
    color: white;
    border-color: var(--vert-fonce);
    transform: scale(1.05);
  }
  .bulle.choisi-faux {
    background: linear-gradient(135deg, #ff8a8a, var(--rouge));
    color: white;
    border-color: var(--rouge-fonce);
    animation: secoue 0.4s;
  }
  .bulle.oublie {
    background: #fff0c4;
    border-color: var(--jaune);
    border-style: dashed;
    color: var(--texte);
    position: relative;
  }
  .bulle.oublie::after {
    content: '👀';
    position: absolute;
    top: -10px;
    right: -8px;
    font-size: 1.4rem;
  }
  .bulle.juste-vu {
    background: linear-gradient(135deg, #8fe89e, var(--vert));
    color: white;
    border-color: var(--vert-fonce);
  }
  @keyframes secoue {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* ---- DOMINOS ---- */
  .dominos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 24px;
    margin: 24px 0;
  }
  .domino-bloc { text-align: center; }
  .domino {
    background: white;
    border: 4px solid var(--noir);
    border-radius: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 95px;
    width: 190px;
    margin: 0 auto 14px;
    position: relative;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }
  .domino::after {
    content: '';
    position: absolute;
    top: 8px;
    bottom: 8px;
    left: 50%;
    width: 3px;
    background: var(--noir);
    transform: translateX(-50%);
  }
  .domino-cote {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 8px;
    place-items: center;
  }
  .point {
    width: 15px;
    height: 15px;
    background: var(--noir);
    border-radius: 50%;
  }
  .label-domino {
    font-size: 1.15rem;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .input-double {
    width: 80px;
    height: 56px;
    border: 4px solid var(--bleu);
    border-radius: 14px;
    font-size: 1.6rem;
    text-align: center;
    font-family: inherit;
    font-weight: bold;
    color: var(--texte);
    background: var(--fond);
  }
  .input-double:focus { outline: none; border-color: var(--bleu-fonce); background: white; transform: scale(1.05); }
  .input-double.juste { background: linear-gradient(135deg, #8fe89e, var(--vert)); color: white; border-color: var(--vert-fonce); }
  .input-double.faux { background: linear-gradient(135deg, #ff8a8a, var(--rouge)); color: white; border-color: var(--rouge-fonce); animation: secoue 0.4s; }
  .input-double.oublie {
    background: #fff0c4;
    border-color: var(--jaune);
    border-style: dashed;
    color: var(--texte);
  }
  .oubli-icone {
    display: none;
    color: #c98a00;
    font-size: 0.95rem;
    font-weight: bold;
    margin-left: 6px;
  }
  .a-oublie .oubli-icone { display: inline; }

  /* ---- RELIER ---- */
  .relier-conteneur {
    position: relative;
    display: grid;
    grid-template-columns: 160px 1fr 160px;
    gap: 0;
    max-width: 760px;
    margin: 0 auto;
    padding: 10px 0;
  }
  .col-calculs, .col-reponses {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .relier-calcul, .relier-reponse {
    background: linear-gradient(135deg, var(--fond), #ffeaca);
    border: 4px solid #f0d8a8;
    border-radius: 16px;
    padding: 14px;
    font-size: 1.3rem;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .relier-calcul:hover, .relier-reponse:hover {
    transform: scale(1.04);
    border-color: var(--rouge);
  }
  .relier-calcul.actif, .relier-reponse.actif {
    background: linear-gradient(135deg, #ffe388, var(--jaune));
    border-color: var(--rouge);
    transform: scale(1.06);
  }
  .relier-calcul.lie, .relier-reponse.lie {
    background: linear-gradient(135deg, #8fe89e, var(--vert));
    color: white;
    border-color: var(--vert-fonce);
    cursor: default;
  }
  .relier-calcul.lie-faux, .relier-reponse.lie-faux {
    background: linear-gradient(135deg, #ff8a8a, var(--rouge));
    color: white;
    border-color: var(--rouge-fonce);
    cursor: default;
  }
  .relier-calcul.oublie, .relier-reponse.oublie {
    background: #fff0c4;
    border-color: var(--jaune);
    border-style: dashed;
    color: var(--texte);
    position: relative;
  }
  .relier-calcul.oublie::after, .relier-reponse.oublie::after {
    content: '👀';
    position: absolute;
    top: -10px;
    right: -8px;
    font-size: 1.2rem;
  }
  .lignes-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ---- CALCULS ---- */
  .calcs-additions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
    margin: 20px 0;
  }
  .calc-ligne {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 1.6rem;
    font-weight: bold;
    background: linear-gradient(135deg, var(--fond), #fffaf2);
    padding: 16px;
    border-radius: 16px;
    border: 4px solid #f0d8a8;
  }

  /* ---- BOUTONS ---- */
  .boutons {
    display: flex;
    justify-content: space-between;
    margin-top: 22px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 16px 32px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
  }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .btn-valider { background: var(--vert); color: white; }
  .btn-valider:hover:not(:disabled) { background: #5cc269; }
  .btn-suivant { background: var(--bleu); color: white; margin-left: auto; }
  .btn-suivant:hover:not(:disabled) { background: var(--bleu-fonce); }
  .btn-recommencer { background: var(--jaune); color: var(--texte); }
  .btn-rejouer-niveau { background: var(--rose); color: white; }
  .btn-rejouer-niveau:hover { background: #e87599; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .feedback {
    margin-top: 16px;
    padding: 16px;
    border-radius: 16px;
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    min-height: 24px;
  }
  .feedback.ok { background: linear-gradient(135deg, #8fe89e, var(--vert)); color: white; }
  .feedback.ko { background: linear-gradient(135deg, #ff8a8a, var(--rouge)); color: white; }
  .feedback.info { background: linear-gradient(135deg, #ffe388, var(--jaune)); color: var(--texte); }

  /* ---- ECRAN ACCUEIL / FIN ---- */
  .ecran-accueil, .ecran-fin, .ecran-niveau-reussi {
    text-align: center;
    padding: 30px 20px;
  }
  .ecran-accueil h1 {
    font-size: 2.3rem;
    color: var(--rouge-fonce);
    margin-bottom: 10px;
  }
  .ecran-accueil .sous-titre {
    font-size: 1.3rem;
    margin-bottom: 22px;
    opacity: 0.8;
  }
  .grosse-cocci {
    font-size: 7rem;
    display: inline-block;
    animation: marche 2.5s ease-in-out infinite;
    margin-bottom: 14px;
  }
  @keyframes marche {
    0%, 100% { transform: translateX(0) rotate(-3deg); }
    50% { transform: translateX(15px) rotate(3deg); }
  }
  .btn-jouer {
    background: var(--rouge);
    color: white;
    padding: 22px 56px;
    font-size: 1.6rem;
    margin-top: 16px;
  }
  .btn-jouer:hover { background: var(--rouge-fonce); }

  .ecran-niveau-reussi h2, .ecran-fin h2 {
    font-size: 2.3rem;
    color: var(--vert-fonce);
    margin-bottom: 16px;
  }
  .cocci-gagnee {
    font-size: 7rem;
    display: inline-block;
    animation: tournoie 1s ease;
    margin-bottom: 10px;
  }
  @keyframes tournoie {
    0% { transform: scale(0) rotate(0deg); }
    60% { transform: scale(1.4) rotate(360deg); }
    100% { transform: scale(1) rotate(360deg); }
  }
  .gros-trophee {
    font-size: 7rem;
    display: inline-block;
    animation: bondit 1s ease-in-out infinite;
  }
  @keyframes bondit {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-18px) rotate(5deg); }
  }
  .rangee-cocci-finale {
    font-size: 3rem;
    margin: 18px 0;
    letter-spacing: 8px;
  }

  /* ---- CONFETTIS ---- */
  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    pointer-events: none;
    z-index: 1000;
    border-radius: 2px;
  }

  /* ---- MOBILE ---- */
  @media (max-width: 600px) {
    .titre-jeu { font-size: 1.2rem; }
    .consigne { font-size: 1.15rem; }
    .bulle { font-size: 1.3rem; padding: 18px 6px; }
    .ecran-accueil h1 { font-size: 1.6rem; }
    .gros-trophee, .grosse-cocci, .cocci-gagnee { font-size: 5rem; }
    .calc-ligne { font-size: 1.3rem; padding: 14px; }
    .slot-cocci { width: 36px; height: 36px; font-size: 1.3rem; }
    .relier-conteneur { grid-template-columns: 110px 1fr 110px; }
    .col-calculs, .col-reponses { gap: 20px; }
    .relier-calcul, .relier-reponse { font-size: 1.1rem; padding: 12px; }
  }

  .signature {
    margin-top: 22px;
    padding: 10px 18px;
    background: white;
    border-radius: 999px;
    border: 3px solid var(--rouge);
    font-size: 0.95rem;
    color: var(--rouge-fonce);
    font-weight: bold;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  }
  .signature .nom { color: var(--texte); }
</style>
</head>
<body>

<div class="header">
  <div class="header-haut">
    <div class="titre-jeu">
      <span style="font-size:1.8rem;">🐞</span>
      <span>Les Doubles</span>
    </div>
    <div class="niveau-actuel" id="niveau-actuel">Bienvenue !</div>
  </div>
  <div class="collection-coccinelles" id="collection">
    <!-- 7 slots remplis par JS -->
  </div>
</div>

<div id="app"></div>

<div class="signature">🐞 Créé par <span class="nom">Chloé Drevon</span></div>

<script>
  const app = document.getElementById('app');
  const niveauActuelEl = document.getElementById('niveau-actuel');
  const collectionEl = document.getElementById('collection');
  const NB_NIVEAUX = 7;

  let niveau = 0;
  let cocciGagnees = 0;

  function majCollection(nouvelleIdx = -1) {
    collectionEl.innerHTML = '';
    for (let i = 0; i < NB_NIVEAUX; i++) {
      const s = document.createElement('div');
      s.className = 'slot-cocci';
      if (i < cocciGagnees) s.classList.add('gagnee');
      if (i === nouvelleIdx) s.classList.add('nouvelle');
      collectionEl.appendChild(s);
    }
  }
  majCollection();

  function majTitre() {
    if (niveau === 0) niveauActuelEl.textContent = 'Bienvenue !';
    else if (niveau > NB_NIVEAUX) niveauActuelEl.textContent = '🏆 Terminé !';
    else niveauActuelEl.textContent = `Niveau ${niveau} / ${NB_NIVEAUX}`;
  }

  // ---------- ECRAN ACCUEIL ----------
  function ecranAccueil() {
    niveau = 0;
    cocciGagnees = 0;
    majCollection();
    majTitre();
    app.innerHTML = `
      <div class="carte ecran-accueil">
        <div class="grosse-cocci">🐞</div>
        <h1>Salut champion(ne) !</h1>
        <p class="sous-titre">Aide la coccinelle à collectionner ses amies ! 🐞<br>
        <b>7 niveaux</b> à réussir = <b>7 coccinelles</b> à gagner</p>
        <p style="font-size:0.95rem; margin-top:8px; opacity:0.7;">Un jeu de Chloé Drevon</p>
        <button class="btn btn-jouer" onclick="commencerNiveau(1)">🚀 C'est parti !</button>
      </div>
    `;
  }

  function commencerNiveau(n) {
    niveau = n;
    majTitre();
    if (n === 1) niveau1();
    else if (n === 2) niveau2();
    else if (n === 3) niveau3();
    else if (n === 4) niveau4();
    else if (n === 5) niveau5();
    else if (n === 6) niveau6();
    else if (n === 7) niveau7();
    else ecranFin();
  }

  function gagnerCocci() {
    const idx = cocciGagnees;
    cocciGagnees++;
    majCollection(idx);
    confetti(50);
  }

  function ecranNiveauReussi() {
    gagnerCocci();
    const msgs = [
      'Trop bien joué ! 🎉',
      'Tu es génial(e) ! 🌟',
      'Super coccinelle ! 🐞',
      'Magnifique ! ✨',
      'Bravo champion(ne) ! 👏',
      'Tu déchires tout ! 💪',
      'Incroyable ! 🎊'
    ];
    const msg = msgs[Math.min(niveau - 1, msgs.length - 1)];
    const apresClick = niveau < NB_NIVEAUX
      ? `<button class="btn btn-suivant" style="margin: 20px auto 0; display: block;" onclick="commencerNiveau(${niveau + 1})">Niveau suivant →</button>`
      : `<button class="btn btn-suivant" style="margin: 20px auto 0; display: block;" onclick="ecranFin()">Voir mon trophée 🏆</button>`;
    app.innerHTML = `
      <div class="carte ecran-niveau-reussi">
        <div class="cocci-gagnee">🐞</div>
        <h2>${msg}</h2>
        <p style="font-size:1.3rem;">Tu as gagné une <b>nouvelle coccinelle</b> !</p>
        <p style="font-size:1.1rem; margin-top:10px;">Total : ${cocciGagnees} / ${NB_NIVEAUX} 🐞</p>
        ${apresClick}
      </div>
    `;
  }

  // ---------- helpers ----------
  function melanger(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function btnReessayer(fn) {
    return `<button class="btn btn-rejouer-niveau" onclick="(${fn})()">🔄 Je recommence !</button>`;
  }

  // ====================================================
  // NIVEAU 1 : Clique sur les doubles
  // ====================================================
  function niveau1() {
    const calculs = melanger([
      { txt: '5 + 5', double: true },
      { txt: '3 + 2', double: false },
      { txt: '8 + 8', double: true },
      { txt: '6 + 1', double: false },
      { txt: '9 + 9', double: true },
      { txt: '4 + 7', double: false },
      { txt: '2 + 2', double: true },
      { txt: '7 + 0', double: false },
      { txt: '6 + 6', double: true },
    ]);
    const choix = new Set();

    app.innerHTML = `
      <div class="carte">
        <span class="etape-label">Niveau 1 sur ${NB_NIVEAUX} 🐞</span>
        <p class="consigne"><span class="gros-emoji">👆</span> Clique sur tous les <b>doubles</b> !</p>
        <div class="grille-doubles" id="grille1">
          ${calculs.map((c, i) => `<div class="bulle" data-i="${i}">${c.txt}</div>`).join('')}
        </div>
        <div class="feedback" id="fb1"></div>
        <div class="boutons">
          <button class="btn btn-valider" onclick="validerN1()">✓ Valider</button>
        </div>
      </div>
    `;

    document.querySelectorAll('#grille1 .bulle').forEach(el => {
      el.addEventListener('click', () => {
        const i = parseInt(el.dataset.i);
        if (choix.has(i)) { choix.delete(i); el.classList.remove('choisi-double'); }
        else { choix.add(i); el.classList.add('choisi-double'); }
      });
    });

    window.validerN1 = () => {
      let bons = 0, oublies = 0, mauvais = 0;
      const totalDoubles = calculs.filter(c => c.double).length;
      calculs.forEach((c, i) => {
        const el = document.querySelector(`#grille1 .bulle[data-i="${i}"]`);
        el.classList.remove('choisi-double','choisi-faux','oublie','juste-vu');
        if (c.double && choix.has(i)) { bons++; el.classList.add('juste-vu'); }
        else if (c.double && !choix.has(i)) { oublies++; el.classList.add('oublie'); }
        else if (!c.double && choix.has(i)) { mauvais++; el.classList.add('choisi-faux'); }
      });
      const fb = document.getElementById('fb1');
      const btns = document.querySelector('.boutons');
      if (bons === totalDoubles && mauvais === 0) {
        fb.className = 'feedback ok';

      let html = '';

  // ====================================================
  function niveau3() {
    const paires = [

      { calc: '9 + 9', rep: 18 },
      { calc: '8 + 8', rep: 16 },
      { calc: '2 + 2', rep: 4 },
    ];
    const reponsesMelangees = melanger(paires);

    let calculActif = null;
    const liens = new Map();
    const couleurs = ['#ff5252', '#5ec5e6', '#ffa726', '#6bd97a', '#b294ff'];

    app.innerHTML = `
      <div class="carte">
        <span class="etape-label">Niveau 3 sur ${NB_NIVEAUX} 🐞</span>
        <p class="consigne"><span class="gros-emoji">🔗</span> Clique sur un <b>calcul</b> puis sur sa <b>réponse</b> !</p>
        <div class="relier-conteneur">
          <div class="col-calculs">
            ${paires.map((p, i) => `<div class="relier-calcul" data-c="${i}" data-rep="${p.rep}">${p.calc}</div>`).join('')}
          </div>
          <svg class="lignes-svg" id="svg-liens"></svg>
          <div class="col-reponses">
            ${reponsesMelangees.map((p, i) => `<div class="relier-reponse" data-r="${i}" data-val="${p.rep}">${p.rep}</div>`).join('')}
          </div>
        </div>
        <div class="feedback" id="fb3"></div>
        <div class="boutons">
          <button class="btn btn-valider" onclick="validerN3()">✓ Valider</button>
        </div>
      </div>
    `;

    const svg = document.getElementById('svg-liens');
    const conteneur = document.querySelector('.relier-conteneur');

    function redessinerLignes(verdict = null) {
      const rect = conteneur.getBoundingClientRect();
      svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
      svg.style.width = rect.width + 'px';
      svg.style.height = rect.height + 'px';
      svg.innerHTML = '';
      let idx = 0;
      liens.forEach((rId, cId) => {
        const cEl = document.querySelector(`.relier-calcul[data-c="${cId}"]`);
        const rEl = document.querySelector(`.relier-reponse[data-r="${rId}"]`);
        const cR = cEl.getBoundingClientRect();
        const rR = rEl.getBoundingClientRect();
        const x1 = cR.right - rect.left;
        const y1 = cR.top + cR.height/2 - rect.top;
        const x2 = rR.left - rect.left;
        const y2 = rR.top + rR.height/2 - rect.top;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y1);
        line.setAttribute('x2', x2); line.setAttribute('y2', y2);
        let stroke = couleurs[idx % couleurs.length];
        if (verdict) {
          const repAttendue = parseInt(cEl.dataset.rep);
          const repDonnee = parseInt(rEl.dataset.val);
          stroke = repAttendue === repDonnee ? '#43a64f' : '#c83232';
        }
        line.setAttribute('stroke', stroke);
        line.setAttribute('stroke-width', 5);
        line.setAttribute('stroke-linecap', 'round');
        svg.appendChild(line);
        idx++;
      });
    }

    function essayerLien(rId) {
      if (calculActif === null) return;
      liens.forEach((r, c) => {
        if (r === rId) {
          liens.delete(c);
          document.querySelector(`.relier-calcul[data-c="${c}"]`).classList.remove('actif');
        }
      });
      liens.set(calculActif, rId);
      document.querySelector(`.relier-calcul[data-c="${calculActif}"]`).classList.remove('actif');
      calculActif = null;
      redessinerLignes();
    }

    document.querySelectorAll('.relier-calcul').forEach(el => {
      el.addEventListener('click', () => {
        if (el.classList.contains('lie') || el.classList.contains('lie-faux')) return;
        document.querySelectorAll('.relier-calcul.actif').forEach(e => e.classList.remove('actif'));
        calculActif = parseInt(el.dataset.c);
        el.classList.add('actif');
      });
    });
    document.querySelectorAll('.relier-reponse').forEach(el => {
      el.addEventListener('click', () => {
        if (calculActif !== null) essayerLien(parseInt(el.dataset.r));
      });
    });
    window.addEventListener('resize', () => redessinerLignes());

    window.validerN3 = () => {
      let bons = 0;
      const totalLiens = liens.size;
      const oublies = paires.length - totalLiens;
      liens.forEach((rId, cId) => {
        const cEl = document.querySelector(`.relier-calcul[data-c="${cId}"]`);
        const rEl = document.querySelector(`.relier-reponse[data-r="${rId}"]`);
        const repAttendue = parseInt(cEl.dataset.rep);
        const repDonnee = parseInt(rEl.dataset.val);
        if (repAttendue === repDonnee) {
          bons++;
          cEl.classList.add('lie'); rEl.classList.add('lie');
        } else {
          cEl.classList.add('lie-faux'); rEl.classList.add('lie-faux');
        }
      });
      document.querySelectorAll('.relier-calcul').forEach(el => {
        if (!liens.has(parseInt(el.dataset.c))) el.classList.add('oublie');
      });
      redessinerLignes(true);
      const fb = document.getElementById('fb3');
      const btns = document.querySelector('.boutons');
      if (bons === paires.length) {
        fb.className = 'feedback ok';
        fb.textContent = '🎊 Super ! Toutes les paires sont bonnes !';
        btns.innerHTML = `<button class="btn btn-suivant" onclick="ecranNiveauReussi()">Gagner ma coccinelle 🐞</button>`;
        confetti();
      } else {
        fb.className = 'feedback info';
        let msg = `${bons}/${paires.length} paires bonnes. `;
        if (oublies > 0) msg += `👀 ${oublies} pas relié${oublies>1?'s':''}. `;
        msg += `Tu peux le faire, on recommence !`;
        fb.textContent = msg;
        btns.innerHTML = btnReessayer('niveau3');
      }
    };
  }

  function niveau6() {
    const items = melanger([
      { a: 2, b: 2, r: 4,  juste: true },

      { a: 4, b: 4, r: 9,  juste: false },

        <span class="etape-label">Niveau 6 sur ${NB_NIVEAUX} 🐞</span>

          <button class="btn btn-valider" onclick="validerN6()">✓ Valider</button>
        </div>
      </div>
    `;

    document.querySelectorAll('#grille6 .bulle').forEach(el => {
      el.addEventListener('click', () => {
        const i = parseInt(el.dataset.i);
        if (choix.has(i)) { choix.delete(i); el.classList.remove('choisi-double'); }
        else { choix.add(i); el.classList.add('choisi-double'); }
      });
    });

    window.validerN6 = () => {
      let bons = 0, oublies = 0, mauvais = 0;
      const total = items.filter(c => c.juste).length;
      items.forEach((c, i) => {
        const el = document.querySelector(`#grille6 .bulle[data-i="${i}"]`);

        if (c.juste && choix.has(i)) { bons++; el.classList.add('juste-vu'); }
        else if (c.juste && !choix.has(i)) { oublies++; el.classList.add('oublie'); }
        else if (!c.juste && choix.has(i)) { mauvais++; el.classList.add('choisi-faux'); }

  // ---------- CONFETTIS ----------
  function confetti(qte = 30) {
    const couleurs = ['#ff5252','#5ec5e6','#ffd54a','#6bd97a','#b294ff','#ff8fb1','#1f1f1f'];
    for (let i = 0; i < qte; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = couleurs[Math.floor(Math.random() * couleurs.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      document.body.appendChild(c);
      const duration = 1500 + Math.random() * 1500;
      const driftX = (Math.random() - 0.5) * 200;
      const rot = Math.random() * 720;
      c.animate(
        [{ transform: 'translate(0,0) rotate(0)', opacity: 1 },
         { transform: `translate(${driftX}px, 110vh) rotate(${rot}deg)`, opacity: 0.5 }],
        { duration, easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)' }
      );
      setTimeout(() => c.remove(), duration);
    }
  }
